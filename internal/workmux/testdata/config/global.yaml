# Installed externally as config.yaml. Omitted and null optional values inherit.
# Use panes: [] for no additional setup, and [] to disable hooks or file lists.
panes:
  - command: editor
    focus: true
  - command: go test ./...
    split: vertical
    percentage: 30
files:
  copy: [.env, local/*.json]
  symlink: [cache]
layouts:
  review:
    panes:
      - command: git diff
        zoom: true
      - split: horizontal
        size: 20
  shell:
    panes: []
post_create: [prepare, report]
pre_merge: [check]
pre_remove: [clean]
sandbox:
  enabled: true
  image: registry.example.com/team/dev:stable
